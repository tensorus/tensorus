[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tensorus"
version = "0.2.0"
description = "Official Python SDK, Xarray integration, and Model Context Protocol (MCP) bridge for Tensorus — The Agentic Tensor Database and Data Lakehouse."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tensorus", email = "ai@tensorus.com" }]
keywords = [
  "tensor",
  "database",
  "lakehouse",
  "numpy",
  "xarray",
  "zarr",
  "agentic",
  "mcp",
  "scientific-computing",
  "machine-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2.4.1,<3",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.22,<2"]
mlflow = ["mlflow-skinny>=2.16,<4"]
xarray = ["xarray>=2025.1,<2027"]
all = ["mcp>=1.22,<2", "mlflow-skinny>=2.16,<4", "xarray>=2025.1,<2027"]

[project.scripts]
tensorus = "tensorus.sdk_cli:main"
tensorus-mcp = "tensorus.mcp_server:run"

[project.urls]
Homepage = "https://tensorus.com"
Repository = "https://github.com/tensorus/tensorus"
Issues = "https://github.com/tensorus/tensorus/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorus"]

[tool.hatch.build.targets.sdist]
include = ["src/tensorus", "examples", "README.md", "LICENSE", "pyproject.toml"]
